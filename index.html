<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f8">
  <title>KlaimKu | Reimbursement Perusahaan</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell" id="appShell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="KlaimKu dashboard">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none"><rect x="5" y="10" width="30" height="20" rx="4" fill="currentColor"/><path d="M9 15c3 0 5-1 6-3h10c1 2 3 3 6 3v10c-3 0-5 1-6 3H15c-1-2-3-3-6-3V15Z" fill="#fff" fill-opacity=".94"/><circle cx="20" cy="20" r="4" fill="#8B78D4"/><path d="M8 16h2m20 8h2" stroke="#8B78D4" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        <span class="brand-copy"><strong>KlaimKu</strong><small>REIMBURSEMENT</small></span>
      </a>

      <div class="nav-caption">MENU UTAMA</div>
      <nav class="side-nav" aria-label="Navigasi utama">
        <button class="nav-link active" data-view="dashboard"><span class="nav-icon"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="4" rx="1.5"/><rect x="13.5" y="10.5" width="7" height="10" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span><span>Dashboard</span></button>
        <button class="nav-link" data-view="reimbursements"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 4.5h14a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 18V6A1.5 1.5 0 0 1 5 4.5Z"/><path d="M7.5 9h9m-9 4h5m-5 4h7"/></svg></span><span>Reimbursement</span><span class="nav-count" id="pendingCount">0</span></button>
        <div class="nav-caption nav-caption-spaced">DATA MASTER</div>
        <button class="nav-link" data-view="employees"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.8 19.5v-1.2a5 5 0 0 1 5-5h2.4a5 5 0 0 1 5 5v1.2M16 4.8a3.5 3.5 0 0 1 0 6.7m2.2 2.1a4.5 4.5 0 0 1 3 4.3v1.6"/></svg></span><span>Karyawan</span></button>
        <button class="nav-link" data-view="departments"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 20V7.5L12 4l8 3.5V20M2.5 20h19M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01M10 20v-3h4v3"/></svg></span><span>Departemen</span></button>
        <button class="nav-link" data-view="categories"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M4 6.5h16M4 12h16M4 17.5h16"/><circle cx="8" cy="6.5" r="2" fill="#f5f5f8"/><circle cx="15" cy="12" r="2" fill="#f5f5f8"/><circle cx="10" cy="17.5" r="2" fill="#f5f5f8"/></svg></span><span>Kategori</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="help-card"><span class="help-spark">✳</span><strong>Butuh bantuan?</strong><span>Tim finance siap membantu.</span><a href="mailto:finance@perusahaan.co.id">Hubungi tim <span aria-hidden="true">↗</span></a></div>
        <button class="connection-button" id="connectionButton"><span class="connection-dot"></span><span id="connectionLabel">Mode demo</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.5 2.6-1.7-.7a8 8 0 0 1-1.6.9l-.3 1.8h-3l-.3-1.8a8 8 0 0 1-1.6-.9l-1.7.7-1.5-2.6 1.4-1.1a7 7 0 0 1 0-1.9l-1.4-1.1 1.5-2.6 1.7.7a8 8 0 0 1 1.6-.9l.3-1.8h3l.3 1.8a8 8 0 0 1 1.6.9l1.7-.7 1.5 2.6-1.4 1.1a7 7 0 0 1 0 1.8Z"/></svg></button>
        <div class="sidebar-user"><span class="user-avatar" id="userAvatar">RK</span><span class="user-details"><strong id="userName">Rani Kusuma</strong><small id="userRole">Finance manager</small></span><button class="logout-button" id="logoutButton" aria-label="Keluar" title="Keluar" hidden><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5m5 5H3m9-9h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg></button></div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Buka navigasi"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumbCurrent">Dashboard</strong></div>
        <div class="topbar-actions"><span class="today-label" id="todayLabel"></span><button class="icon-button notification-button" id="notificationButton" aria-label="Notifikasi" title="Notifikasi"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9m-8 12h4"/></svg><i></i></button><span class="top-avatar" id="topAvatar">RK</span></div>
      </header>
      <div class="page-content" id="pageContent"></div>
      <footer class="page-footer"><span>KlaimKu <span class="footer-dot">·</span> Reimbursement, lebih tertata.</span><span id="footerConnection">Data tersimpan di perangkat ini</span></footer>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section></div>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
